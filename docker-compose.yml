version: '3.8'

services:
  # PostgreSQL Database (In-Memory)
  postgres:
    image: postgres:15-alpine
    container_name: foodorder-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
      PGDATA: /dev/shm/pgdata
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodorder-network

  # Zookeeper (required for Kafka, In-Memory)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: foodorder-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_DATA_DIR: /tmp/zookeeper/data
      ZOOKEEPER_DATA_LOG_DIR: /tmp/zookeeper/datalog
    tmpfs:
      - /tmp/zookeeper
    ports:
      - "2181:2181"
    networks:
      - foodorder-network

  # Kafka (In-Memory)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: foodorder-kafka
    user: root
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    tmpfs:
      - /var/lib/kafka/data
      - /tmp/kafka-logs
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - foodorder-network

  # Python Delivery Service
  python-delivery:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: foodorder-python
    ports:
      - "8010:8010"
    environment:
      FLASK_ENV: production
    networks:
      - foodorder-network
    restart: unless-stopped

  # Java Service
  java-service:
    build:
      context: ./java
      dockerfile: Dockerfile
    container_name: foodorder-java
    depends_on:
      postgres:
        condition: service_healthy
      python-delivery:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
      DB_NAME: postgres
      PYTHON_SERVICE_URL: http://python-delivery:8010
    networks:
      - foodorder-network
    restart: unless-stopped

  # Go Service
  go-service:
    build:
      context: ./go
      dockerfile: Dockerfile
    container_name: foodorder-go
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      java-service:
        condition: service_started
    ports:
      - "8081:8081"
      - "50058:50058"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
      DB_NAME: postgres
      KAFKA_BROKER: kafka:29092
      JAVA_SERVICE_URL: http://java-service:8085
    networks:
      - foodorder-network
    restart: unless-stopped

networks:
  foodorder-network:
    driver: bridge
